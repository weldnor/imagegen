services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: imagen
      POSTGRES_PASSWORD: imagen
      POSTGRES_DB: imagen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagen -d imagen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - images:/data/images
    restart: unless-stopped

volumes:
  pgdata:
  images:
